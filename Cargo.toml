[package]
name = "drum-pi"
version = "0.1.0"
edition = "2021"
description = "LED driver server for the drumui drum-learning kit. Runs on a Raspberry Pi 4."
license = "MIT"

[[bin]]
name = "drum-pi"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
parking_lot = "0.12"

# rppal pulls in real GPIO on Linux/aarch64 (Raspberry Pi).
# On macOS the build still succeeds — rppal compiles a no-op stub backend
# only on Linux, so we gate the real driver via cfg below and provide a
# mock driver for development on a laptop.
[target.'cfg(target_os = "linux")'.dependencies]
rppal = "0.19"
